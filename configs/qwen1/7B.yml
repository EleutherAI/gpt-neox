# Based on https://huggingface.co/Qwen/Qwen-7B/blob/main/config.json

{
  "pipe_parallel_size": 1,
  # model_parallel_size must evenly divide num_attention_heads (32)
  "model_parallel_size": 1,
  # Pads the vocab to 151,936 rows, the HF embedding size (see #1396)
  "make_vocab_size_divisible_by": 1187,

  # model settings
  "num_layers": 32,
  "hidden_size": 4096,
  # HF's intermediate_size (22016) counts w1 and w2 together; each is 11008
  "intermediate_size": 33024, # 11008*3 as 3x needed for swiglu with neox
  "num_attention_heads": 32,
  # HF's dynamic NTK RoPE and logN scaling past seq_length are not implemented
  "seq_length": 8192,
  "max_position_embeddings": 32768,
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "rotary_emb_base": 10000,
  "no_weight_tying": true,
  "gpt_j_residual": false,
  "output_layer_parallelism": "column",
  "norm": "rmsnorm",
  "rms_norm_epsilon": 1.0e-6,
  "attention_config": [[["flash"], 32]],

  "scaled_upper_triang_masked_softmax_fusion": true,
  "bias_gelu_fusion": false,
  "use_bias_in_norms": false,
  "use_bias_in_attn_linear": "qkv",
  "use_bias_in_mlp": false,
  "activation": "swiglu",
  "mlp_multiple_of": 256,

  # NeoX can't load qwen.tiktoken; Qwen2's tokenizer.json has the same BPE tokens
  "tokenizer_type": "HFTokenizer",
  # "vocab-file": "/path/to/Qwen2-7B/tokenizer.json",

  "init_method_std": 0.02
}
