name: "Run CPU Tests"

on: "push"

jobs:
  run-tests:
    #runs-on: ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Upgrade Pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          sudo apt-get install libopenmpi-dev -y
          constraints="$RUNNER_TEMP/cpu-constraints.txt"
          printf '%s\n' 'torch==2.6.0+cpu' > "$constraints"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -c "$constraints" torch
          python -m pip install -c "$constraints" -r requirements/requirements.txt \
            -r requirements/requirements-dev.txt -r requirements/requirements-wandb.txt
          python -m pip check

      - name: Prepare Data
        run: python prepare_data.py

      - name: Run CPU Tests
        run: pytest tests -m cpu --torch_ver 2.6.0+cpu
