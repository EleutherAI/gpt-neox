# Parameters used for text generation
# Make sure `load` is specified somewhere else
{
  # Text generation: input-file, unconditional, or interactive.
  # precompute is a separate indexed-dataset mode; see ../INFERENCE.md.
  "text_gen_type": "unconditional",

  # Token budgets count new tokens, not the prompt.
  "maximum_tokens": 102,
  "minimum_tokens": 0,
  "temperature": 1.0,  # Positive enables sampling; 0 is greedy and ignores the filters below.
  # Filters are applied in this order. Neutral values below leave scores unchanged.
  "top_h": 0.0,
  "top_k": 0,
  "top_p": 1.0,  # No nucleus filtering (legacy 0.0 also disables it).
  "min_p": 0.0,
  "typical_p": 1.0,
  "epsilon_cutoff": 0.0,
  "eta_cutoff": 0.0,
  "recompute": false,  # Reuse the KV cache; see INFERENCE.md for model-specific exceptions.

  # `unconditional`: samples
  "num_samples": 10,

  "prompt_end": "\n",  # Prompt delimiter in input-file and interactive modes.
  "sample_input_file": "sample_input.txt",  # Used only in input-file mode.
  "sample_output_file": "sample_output.txt",  # Overwritten with JSONL in input-file and unconditional modes.
}
