# Based on https://huggingface.co/Qwen/Qwen1.5-32B/blob/main/config.json

{
  "pipe_parallel_size": 1,
  "model_parallel_size": 1,
  "make_vocab_size_divisible_by": 1,

  # model settings
  "num_layers": 64,
  "hidden_size": 5120,
  "intermediate_size": 82176, # 27392*3 as 3x needed for swiglu with neox
  "num_attention_heads": 40,
  "num_kv_heads": 8,
  "seq_length": 32768,
  "max_position_embeddings": 32768,
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "rotary_emb_base": 1000000.0,
  "no_weight_tying": false,
  "gpt_j_residual": false,
  "output_layer_parallelism": "column",
  "norm": "rmsnorm",
  "rms_norm_epsilon": 1.0e-6,

  "scaled_upper_triang_masked_softmax_fusion": true,
  "bias_gelu_fusion": false,
  "use_bias_in_norms": false,
  "use_bias_in_attn_linear": false,
  "activation": "swiglu", # Mentioned here - https://huggingface.co/Qwen/Qwen1.5-0.5B#model-details
  "mlp_multiple_of": 256,

  "init_method_std": 0.02
}
