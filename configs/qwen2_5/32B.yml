# Based on https://huggingface.co/Qwen/Qwen2.5-32B/blob/main/config.json
#
# NOTE: Qwen2.5 uses a bias on the Q/K/V projections but not on the attention
# output projection. `use_bias_in_attn_linear` toggles both together, so the
# Q/K/V bias is omitted here.

{
  "pipe_parallel_size": 1,
  # model_parallel_size must evenly divide num_kv_heads (8)
  "model_parallel_size": 1,
  # The Qwen2.5 tokenizer has 151,665 tokens; 128 pads it to 151,680.
  # (HF checkpoints for this size pad the embedding to 152,064.)
  "make_vocab_size_divisible_by": 128,

  # model settings
  "num_layers": 64,
  "hidden_size": 5120,
  "intermediate_size": 82944, # 27648*3 as 3x needed for swiglu with neox
  "num_attention_heads": 40,
  "num_kv_heads": 8,
  # Qwen2.5 is pretrained at 4,096 tokens (RoPE base 10,000), then extended to
  # 32,768 tokens (RoPE base 1,000,000) in the final pretraining stage.
  # This config matches the final stage.
  "seq_length": 32768,
  "max_position_embeddings": 131072,
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "rotary_emb_base": 1000000,
  "no_weight_tying": true,
  "gpt_j_residual": false,
  "output_layer_parallelism": "column",
  "norm": "rmsnorm",
  "rms_norm_epsilon": 1.0e-5,
  "attention_config": [[["flash"], 64]],

  "scaled_upper_triang_masked_softmax_fusion": true,
  "bias_gelu_fusion": false,
  "use_bias_in_norms": false,
  "use_bias_in_attn_linear": false,
  "use_bias_in_mlp": false,
  "activation": "swiglu",
  "mlp_multiple_of": 256,

  "tokenizer_type": "HFTokenizer",
  # "vocab-file": "/path/to/Qwen2.5-32B/tokenizer.json",

  "init_method_std": 0.02
}
