# Based on https://huggingface.co/allenai/OLMo-2-0425-1B/blob/main/config.json

{
  "pipe_parallel_size": 1,
  "model_parallel_size": 1,
  "make_vocab_size_divisible_by": 128, # pads the OLMo 2 tokenizer to 100352

  # model settings
  "num_layers": 16,
  "hidden_size": 2048,
  "intermediate_size": 24576, # 8192*3 as NeoX requires 3x with Swiglu
  "num_attention_heads": 16,
  "num_kv_heads": 16,
  "seq_length": 4096,
  "max_position_embeddings": 4096,
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "rotary_emb_base": 500000,
  "no_weight_tying": true,
  "gpt_j_residual": false,
  "output_layer_parallelism": "column",
  "norm": "rmsnorm",
  "norm_placement": "post_norm_inside_residual",
  "rms_norm_epsilon": 1.0e-6,
  "use_qk_norm": true,
  "qk_norm": "rmsnorm",
  "qk_norm_type": "across_heads",
  "qk_norm_separate": true,
  "qk_norm_across_tp": true,
  "use_bias_in_mlp": false,

  "attention_softmax_in_fp32": true,
  "scaled_upper_triang_masked_softmax_fusion": true,
  "bias_gelu_fusion": false,
  "use_bias_in_norms": false,
  "use_bias_in_attn_linear": false,
  "activation": "swiglu",
  "mlp_multiple_of": 256,
}
