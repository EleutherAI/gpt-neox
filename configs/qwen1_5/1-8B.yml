# Based on https://huggingface.co/Qwen/Qwen1.5-1.8B/blob/main/config.json
#
# Qwen1.5 has a bias on the Q/K/V projections but not on the attention
# output projection.

{
  "pipe_parallel_size": 1,
  # model_parallel_size must evenly divide num_attention_heads (16)
  "model_parallel_size": 1,
  # The Qwen1.5 tokenizer has 151,646 tokens; 128 pads it to 151,680.
  # (HF checkpoints for this size pad the embedding to 151,936.)
  "make_vocab_size_divisible_by": 128,

  # model settings
  "num_layers": 24,
  "hidden_size": 2048,
  "intermediate_size": 16512, # 5504*3 as 3x needed for swiglu with neox
  "num_attention_heads": 16,
  "seq_length": 32768,
  "max_position_embeddings": 32768,
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "rotary_emb_base": 1000000,
  "no_weight_tying": true,
  "gpt_j_residual": false,
  "output_layer_parallelism": "column",
  "norm": "rmsnorm",
  "rms_norm_epsilon": 1.0e-6,
  "attention_config": [[["flash"], 24]],

  "scaled_upper_triang_masked_softmax_fusion": true,
  "bias_gelu_fusion": false,
  "use_bias_in_norms": false,
  "use_bias_in_attn_linear": "qkv",
  "use_bias_in_mlp": false,
  "activation": "swiglu",
  # 5504 is a multiple of 128 but not 256; 256 would round the FFN up to 5632
  "mlp_multiple_of": 128,

  "tokenizer_type": "HFTokenizer",
  # "vocab-file": "/path/to/Qwen1.5-1.8B/tokenizer.json",

  "init_method_std": 0.02
}
