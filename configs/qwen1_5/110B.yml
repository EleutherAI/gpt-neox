# Based on https://huggingface.co/Qwen/Qwen1.5-110B/blob/main/config.json

{
  "pipe_parallel_size": 1,
  # model_parallel_size must evenly divide num_kv_heads (8)
  "model_parallel_size": 1,
  # Pads the vocab to 152,064 rows, the HF embedding size (see #1396)
  "make_vocab_size_divisible_by": 432,

  # model settings
  "num_layers": 80,
  "hidden_size": 8192,
  "intermediate_size": 147456, # 49152*3 as 3x needed for swiglu with neox
  "num_attention_heads": 64,
  "num_kv_heads": 8,
  "seq_length": 32768,
  "max_position_embeddings": 32768,
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "rotary_emb_base": 1000000,
  "no_weight_tying": true,
  "gpt_j_residual": false,
  "output_layer_parallelism": "column",
  "norm": "rmsnorm",
  "rms_norm_epsilon": 1.0e-6,
  "attention_config": [[["flash"], 80]],

  "scaled_upper_triang_masked_softmax_fusion": true,
  "bias_gelu_fusion": false,
  "use_bias_in_norms": false,
  "use_bias_in_attn_linear": "qkv",
  "use_bias_in_mlp": false,
  "activation": "swiglu",
  "mlp_multiple_of": 256,

  "tokenizer_type": "HFTokenizer",
  # "vocab-file": "/path/to/Qwen1.5-110B/tokenizer.json",

  "init_method_std": 0.02
}
